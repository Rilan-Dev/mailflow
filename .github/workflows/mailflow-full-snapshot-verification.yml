name: MailFlow pinned snapshot full verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mailflow-full-snapshot-verification.yml"
      - "extraction/manifests/closure-test-results-2026-10-17-35067fc.json"
      - "extraction/manifests/capability-closure-2026-10-17-35067fc.json"
      - "extraction/source-pins/current.json"
      - "extraction/tools/verify-inventory.mjs"

permissions:
  contents: read

concurrency:
  group: mailflow-full-snapshot-verification
  cancel-in-progress: false

env:
  SNAPSHOT: extraction/snapshots/35067fc2876d50980f1a8a3b8ea72b5467b69f60/source

jobs:
  inventory-verifier:
    name: Exact pinned snapshot and manifest verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify source tree, blobs, modes, symlinks, path register and closure references
        run: node extraction/tools/verify-inventory.mjs

  backend-full:
    name: Full backend lint, plugin boundary, tests and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.SNAPSHOT }}/backend/package-lock.json
      - name: Install pinned backend dependencies
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm ci
      - name: Lint
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm run lint
      - name: Plugin boundary lint
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm run lint:plugins
      - name: Syntax check
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: node --check src/index.js
      - name: Full backend test suite
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm test
      - name: Production dependency audit
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm audit --omit=dev --audit-level=high

  frontend-full:
    name: Full frontend lint, tests, production build and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.SNAPSHOT }}/frontend/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm ci
      - name: Lint
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm run lint
      - name: Full frontend and Electron Node test suite
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm test
      - name: Production web build
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm run build
      - name: Production dependency audit
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm audit --omit=dev --audit-level=high

  android-debug:
    name: Android sync, unit tests and debug APK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.SNAPSHOT }}/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned frontend dependencies
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm ci
      - name: Build web bundle and sync native Android project
        working-directory: ${{ env.SNAPSHOT }}/frontend
        run: npm run android:sync
      - name: Run Android unit tests and assemble debug APK
        working-directory: ${{ env.SNAPSHOT }}/frontend/packages/android
        # Keep the pinned upstream file mode unchanged; invoke its 100644 wrapper via bash.
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon
        # A successful Gradle task must confirm the wrapper was actually launched.

  postgres-migrations:
    name: Clean PostgreSQL install, 66 migrations and idempotent rerun
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mailflow
          POSTGRES_USER: mailflow
          POSTGRES_PASSWORD: mailflow-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mailflow -d mailflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: mailflow
      DB_USER: mailflow
      DB_PASSWORD: mailflow-test
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ env.SNAPSHOT }}/backend/package-lock.json
      - name: Install pinned backend dependencies
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: npm ci
      - name: Apply all migrations twice and inspect resulting schema
        working-directory: ${{ env.SNAPSHOT }}/backend
        run: |
          node --input-type=module <<'NODE'
          import { runMigrations } from './src/services/migrations.js';
          import { pool } from './src/services/db.js';
          try {
            await runMigrations();
            await runMigrations();
            const { rows: [ledger] } = await pool.query('SELECT COUNT(*)::int AS n FROM schema_migrations');
            if (ledger.n !== 66) throw new Error(`Expected 66 migration ledger rows, found ${ledger.n}`);
            const { rows: [tables] } = await pool.query(`SELECT COUNT(*)::int AS n FROM information_schema.tables WHERE table_schema = 'public' AND table_type = 'BASE TABLE'`);
            const { rows: [indexes] } = await pool.query(`SELECT COUNT(*)::int AS n FROM pg_indexes WHERE schemaname = 'public'`);
            const { rows: [constraints] } = await pool.query(`SELECT COUNT(*)::int AS n FROM information_schema.table_constraints WHERE constraint_schema = 'public'`);
            if (tables.n < 15 || indexes.n < 20 || constraints.n < 20) {
              throw new Error(`Schema object counts below sanity thresholds: tables=${tables.n}, indexes=${indexes.n}, constraints=${constraints.n}`);
            }
            console.log(JSON.stringify({ migrationLedgerRows: ledger.n, tables: tables.n, indexes: indexes.n, constraints: constraints.n }, null, 2));
          } finally {
            await pool.end();
          }
          NODE
