name: MailFlow upstream source snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mailflow-source-snapshot.yml"
      - "extraction/tools/capture-upstream-snapshot.mjs"

permissions:
  contents: write

concurrency:
  group: mailflow-upstream-source-snapshot
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the extraction workspace
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current upstream main outside the working tree
        id: upstream
        run: |
          git clone --depth=1 https://github.com/maathimself/mailflow.git "$RUNNER_TEMP/upstream-source"
          commit=$(git -C "$RUNNER_TEMP/upstream-source" rev-parse HEAD)
          echo "upstream_commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Capture immutable source snapshot and regenerate inventories
        run: node extraction/tools/capture-upstream-snapshot.mjs "$RUNNER_TEMP/upstream-source"

      - name: Verify inventory and exact copied source blobs
        run: node extraction/tools/verify-inventory.mjs

      - name: Commit the source-library update on main
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extraction/source-pins/current.json extraction/manifests/source-tree-*.json extraction/manifests/path-dispositions-*.json extraction/snapshots/
          if git diff --cached --quiet; then
            echo "No new upstream source snapshot to commit."
            exit 0
          fi
          git commit -m "chore(extraction): capture MailFlow upstream $UPSTREAM_COMMIT"
          git push origin HEAD:main
